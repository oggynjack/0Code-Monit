# ===============================================
# Render.com Blueprint for 0Code-Monit
# https://render.com/docs/blueprint-spec
# ===============================================
services:
  - type: web
    name: 0code-monit
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: 0code-monit-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: CODE_MONIT_WS_ORIGIN_CHECK
        value: cors-like
