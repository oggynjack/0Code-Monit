# ===============================================
# Render.com Blueprint for 0Code-Monit (100% FREE TIER)
# https://render.com/docs/blueprint-spec
# ===============================================
services:
  - type: web
    name: 0code-monit
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: ./data
      - key: CODE_MONIT_WS_ORIGIN_CHECK
        value: cors-like
